<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SchoolERP Desktop</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 48px;
      height: 48px;
      background: #3b82f6;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4);
    }
    .logo-icon svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .logo-text {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .status-container {
      width: 80%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .status-text {
      font-size: 13px;
      color: #94a3b8;
      text-align: center;
      height: 20px;
    }
    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar-fill {
      width: 30%;
      height: 100%;
      background: linear-gradient(to right, #3b82f6, #60a5fa);
      border-radius: 9999px;
      transition: width 0.4s ease;
      position: absolute;
      left: 0;
      top: 0;
    }
    .footer-text {
      position: absolute;
      bottom: 16px;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24">
        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
        <path d="M6 12v5c3 3 9 3 12 0v-5"/>
      </svg>
    </div>
    <div class="logo-text">SchoolERP</div>
  </div>

  <div class="status-container">
    <div id="statusText" class="status-text">Starting SchoolERP Desktop Edition...</div>
    <div class="progress-bar-bg">
      <div id="progressBar" class="progress-bar-fill"></div>
    </div>
  </div>

  <div class="footer-text">Offline Desktop Edition v1.0.0</div>

  <script>
    if (window.electronAPI && window.electronAPI.onSplashProgress) {
      window.electronAPI.onSplashProgress((data) => {
        if (data.status) {
          document.getElementById('statusText').innerText = data.status;
        }
        if (typeof data.progress === 'number') {
          document.getElementById('progressBar').style.width = data.progress + '%';
        }
      });
    }
  </script>
</body>
</html>
